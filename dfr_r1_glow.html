<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Transition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
  </style>
</head>
<body>
<script>
  function linearize(c) {
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }

  function delinearize(c) {
    return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1/2.4) - 0.055;
  }

  function linearRgbToOklab(r, g, b) {
    const l = 0.4122214708*r + 0.5363325363*g + 0.0514459929*b;
    const m = 0.2119034982*r + 0.6806995451*g + 0.1073969566*b;
    const s = 0.0883024619*r + 0.2817188376*g + 0.6299787005*b;
    const l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);
    return [
      0.2104542553*l_ + 0.7936177850*m_ - 0.0040720468*s_,
      1.9779984951*l_ - 2.4285922050*m_ + 0.4505937099*s_,
      0.0259040371*l_ + 0.7827717662*m_ - 0.8086757660*s_
    ];
  }

  function oklabToLinearRgb(L, a, b) {
    const l_ = L + 0.3963377774*a + 0.2158037573*b;
    const m_ = L - 0.1055613458*a - 0.0638541728*b;
    const s_ = L - 0.0894841775*a - 1.2914855480*b;
    const l = l_*l_*l_, m = m_*m_*m_, s = s_*s_*s_;
    return [
       4.0767416621*l - 3.3077115913*m + 0.2309699292*s,
      -1.2684380046*l + 2.6097574011*m - 0.3413193965*s,
      -0.0041960863*l - 0.7034186147*m + 1.7076147010*s
    ];
  }

  function hexToOklch(hex) {
    const r = parseInt(hex.slice(1,3), 16) / 255;
    const g = parseInt(hex.slice(3,5), 16) / 255;
    const b = parseInt(hex.slice(5,7), 16) / 255;
    const [L, a, bv] = linearRgbToOklab(linearize(r), linearize(g), linearize(b));
    const C = Math.sqrt(a*a + bv*bv);
    const H = Math.atan2(bv, a) * 180 / Math.PI;
    return [L, C, H < 0 ? H + 360 : H];
  }

  function oklchToCss(L, C, H) {
    const hr = H * Math.PI / 180;
    const [rl, gl, bl] = oklabToLinearRgb(L, C * Math.cos(hr), C * Math.sin(hr));
    const r = Math.round(Math.min(255, Math.max(0, delinearize(rl) * 255)));
    const g = Math.round(Math.min(255, Math.max(0, delinearize(gl) * 255)));
    const b = Math.round(Math.min(255, Math.max(0, delinearize(bl) * 255)));
    return `rgb(${r},${g},${b})`;
  }

  const colors = ['#A00C0B', '#E97132', '#F3BF36'].map(hexToOklch);
  const cycleDuration = 3000;

  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

  function animate() {
    const t = (performance.now() % cycleDuration) / cycleDuration;
    const n = colors.length;
    const segment = t * n;
    const idx = Math.floor(segment) % n;
    const next = (idx + 1) % n;
    const localT = easeInOut(segment - Math.floor(segment));

    const [L1, C1, H1] = colors[idx];
    const [L2, C2, H2] = colors[next];

    // Shortest-path hue interpolation
    let dH = H2 - H1;
    if (dH > 180) dH -= 360;
    if (dH < -180) dH += 360;

    document.body.style.backgroundColor = oklchToCss(
      lerp(L1, L2, localT),
      lerp(C1, C2, localT),
      H1 + dH * localT
    );
    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
</body>
</html>
