<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exit</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #exit {
    width: 100%; height: 100%; min-height: 44px;
    border: 0; margin: 0; padding: 0;
    background: #b71c1c; color: #fff;
    font: bold 15px/1.15 Arial, Helvetica, sans-serif;
    cursor: pointer;
  }
  #exit:focus-visible { outline: 3px solid #fff; outline-offset: -6px; }
  #exit .x { display: block; font-size: 28px; line-height: 1; }
</style>
</head>
<body>
<button id="exit" type="button" aria-label="Exit this site / Salir de este sitio">
  <span class="x">&#10005;</span>exit<br>salir
</button>
<script>
  // Required by Tableau; failure to initialize must not stop the button from working.
  tableau.extensions.initializeAsync().catch(function () {});

  document.getElementById('exit').addEventListener('click', function () {
    // 1) Replace the whole dashboard tab with weather.com. replace() removes the
    //    dashboard from this tab's history, so Back does not return to it.
    try { window.top.location.replace('https://weather.com'); } catch (e) {}

    // 2) Fallback. If step 1 was blocked, this script is still running after 300 ms,
    //    so open weather.com in a new tab instead.
    setTimeout(function () {
      window.open('https://weather.com', '_blank');
    }, 300);
  });
</script>
</body>
</html>
