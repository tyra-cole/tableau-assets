<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DV Hotline Banner</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .banner {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 7px;
      padding: 0 14px;
      width: 100%;
    }

    #msg {
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      opacity: 1;
      transition: opacity 0.5s ease-in-out;
    }

    #msg.fade {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="banner">
    <span id="msg">NEED HELP? National Domestic Violence Hotline: 1-800-788-7233 | Text START to 88788</span>
  </div>

  <script>
    const messages = [
      'NEED HELP? National Domestic Violence Hotline: 1-800-788-7233 | Text START to 88788',
      '\u00BFNECESITAS AYUDA? La L\u00EDnea Nacional sobre Violencia Dom\u00E9stica: 1-800-788-7233 | Texto \u201CSTART\u201D al 88788'
    ];

    let current = 0;
    const el = document.getElementById('msg');

    function rotate() {
      // Step 1: fade out
      el.classList.add('fade');

      setTimeout(function () {
        // Step 2: swap text while invisible
        current = (current + 1) % messages.length;
        el.textContent = messages[current];

        // Step 3: force a reflow so the browser registers the class before removing it
        void el.offsetWidth;

        // Step 4: fade in
        el.classList.remove('fade');
      }, 500); // matches transition duration exactly
    }

    // Switch every 15 seconds
    setInterval(rotate, 15000);
  </script>
</body>
</html>
